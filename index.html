<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Estudos - Legislação IFSULDEMINAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo para quando o checkbox estiver marcado */
        .checkbox-custom:checked + div .topic-title {
            text-decoration: line-through;
            color: #9CA3AF; /* gray-400 */
        }
        .checkbox-custom:checked + div .topic-content {
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-purple-900 mb-2">Checklist de Estudos - IFSULDEMINAS</h1>
            <p class="text-lg text-slate-600">Conhecimentos Básicos: Legislação Aplicada ao Serviço Público</p>
            
            <div class="mt-4 bg-white p-4 rounded-lg shadow-sm inline-block">
                <span class="font-semibold">Progresso Geral (Legislação):</span> 
                <span id="progress-text" class="text-purple-600 font-bold ml-2">0%</span>
                <div class="w-full bg-slate-200 rounded-full h-2.5 mt-2 max-w-xs mx-auto">
                    <div id="progress-bar" class="bg-purple-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- Seção: Legislação -->
        <section class="mb-10">
            <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-purple-500 pb-2 mb-4">Legislação Aplicada (10 Questões)</h2>
            <div class="space-y-4" id="leg-list">
                
                <!-- Item 1 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-1">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">1. Lei nº 8.112/1990 (Regime Jurídico Único)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Provimento, vacância, direitos, vantagens, licenças, regime disciplinar e penalidades.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Confundir os prazos. Lembre-se: são 30 dias para a POSSE (não prorrogáveis) e 15 dias para entrar em EXERCÍCIO. Outra pegadinha clássica é confundir as formas de provimento (ex: Readaptação vs Reversão).</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 2 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-2">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">2. Lei nº 9.784/1999 (Processo Administrativo)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Direitos dos administrados, delegação/avocação de competência, anulação, revogação, e prazos.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> A banca afirma que a "avocação" de competência pode ser feita em qualquer situação e de forma permanente. Falso: ela deve ser excepcional, temporária e devidamente justificada.</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 3 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-3">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">3. Lei nº 8.429/1992 (Improbidade Administrativa)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Enriquecimento ilícito, prejuízo ao erário e atentado contra os princípios da administração.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Após a Lei 14.230/2021, NÃO existe mais punição por improbidade na modalidade CULPOSA. A banca tentará dizer que um erro não intencional gerou improbidade. Hoje, exige-se DOLO (vontade livre e consciente).</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 4 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-4">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">4. Lei nº 12.772/2012 (Carreiras e Cargos de Magistério)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Plano de carreira EBTT, RSC (Reconhecimento de Saberes e Competências), Retribuição por Titulação (RT), progressão e promoção.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Dizer que a Retribuição por Titulação (RT) é cumulativa (ex: recebe pelo Mestrado + Doutorado). Falso, paga-se apenas o valor da maior titulação.</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 5 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-5">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">5. Lei nº 11.892/2008 (Criação dos Institutos Federais)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Finalidades, objetivos, estrutura e as cotas mínimas de vagas para os diferentes níveis de ensino.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Confundir os percentuais obrigatórios: 50% das vagas devem ser para o Ensino Médio Integrado ao Técnico e 20% para cursos de Licenciatura.</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 6 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-6">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">6. Lei nº 7.716/1989 (Crimes de Preconceito e Raça/Cor)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Tipificação dos crimes de racismo, injúria racial (agora equiparada) e implicações no serviço público.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> A banca pode tentar afirmar que o crime prescreve em 10 anos. Falso: conforme a CF, a prática do racismo constitui crime INAFIANÇÁVEL e IMPRESCRITÍVEL.</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 7 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-7">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">7. Lei nº 13.709/2018 (Lei Geral de Proteção de Dados - LGPD)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Dados pessoais vs dados sensíveis, bases legais para tratamento e responsabilidade do serviço público.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Afirmar que o "Consentimento" é a ÚNICA forma legal de tratar dados pessoais. Falso: existem várias outras bases legais (ex: cumprimento de obrigação legal, execução de políticas públicas, etc).</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 8 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-8">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">8. Lei nº 14.540/2023 (Prevenção ao Assédio Sexual)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Diretrizes do Programa, deveres da administração pública, e âmbito de aplicação.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Restringir a lei apenas aos servidores públicos de carreira. A lei é clara ao abranger estagiários, terceirizados e qualquer pessoa que preste serviço no órgão.</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 9 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-9">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">9. Lei nº 9.394/1996 (LDB - Diretrizes e Bases da Educação)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Princípios e fins da educação, organização nacional, incumbências dos entes, Educação Profissional e Tecnológica.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Trocar as obrigações da União com as dos Estados (ex: dizer que a União é responsável pelo acesso prioritário ao Ensino Fundamental). Atenção especial à articulação da Educação Profissional Técnica de Nível Médio (Art. 36-A a 36-D).</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 10 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-10">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">10. Decreto nº 1.171/1994 (Código de Ética Profissional)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Regras deontológicas, deveres, vedações e o funcionamento das Comissões de Ética.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Afirmar que a Comissão de Ética pode aplicar punições de suspensão, demissão ou multa. Falso: A ÚNICA penalidade que a Comissão de Ética pode aplicar é a CENSURA (fundamentada e por escrito).</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Item 11 -->
                <label class="flex items-start bg-white p-5 rounded-lg shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-shadow">
                    <input type="checkbox" class="checkbox-custom w-6 h-6 mt-1 text-purple-600 rounded focus:ring-purple-500" data-id="leg-11">
                    <div class="ml-4 flex-1">
                        <h3 class="topic-title text-xl font-semibold mb-2">11. Decreto nº 12.374/2025 (Avaliação no Estágio Probatório)</h3>
                        <div class="topic-content">
                            <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-800">Foco:</span> Critérios de avaliação durante os 3 anos, composição da comissão de avaliação, direitos de defesa e prazos.</p>
                            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 mt-2 rounded">
                                <p class="text-sm text-purple-900"><span class="font-bold">⚠️ Pegadinha Comum:</span> Confundir os 5 fatores avaliados (Assiduidade, Disciplina, Capacidade de Iniciativa, Produtividade e Responsabilidade) com critérios inventados pela banca (como "criatividade" ou "simpatia"), além de confundir as etapas do processo.</p>
                            </div>
                        </div>
                    </div>
                </label>

            </div>
        </section>

        <footer class="text-center text-slate-500 text-sm mt-8 pb-8">
            <p>Os dados salvos ficam armazenados apenas neste navegador localmente.</p>
            <button onclick="clearProgress()" class="mt-4 text-red-500 hover:text-red-700 underline text-xs">Resetar Todo o Progresso (Legislação)</button>
        </footer>
    </div>

    <!-- Script para salvar o progresso no Local Storage do navegador -->
    <script>
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        // Função para atualizar a barra de progresso
        function updateProgress() {
            const total = checkboxes.length;
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const percentage = Math.round((checked / total) * 100);
            
            progressBar.style.width = percentage + '%';
            progressText.innerText = percentage + '%';
        }

        // Carregar estado salvo ao abrir a página
        window.addEventListener('load', () => {
            checkboxes.forEach(box => {
                const id = box.getAttribute('data-id');
                const savedState = localStorage.getItem('study_leg_' + id);
                if (savedState === 'true') {
                    box.checked = true;
                }
                
                // Adicionar evento de clique para salvar a mudança
                box.addEventListener('change', (e) => {
                    localStorage.setItem('study_leg_' + id, e.target.checked);
                    updateProgress();
                });
            });
            updateProgress();
        });

        // Função para resetar
        function clearProgress() {
            if(confirm("Tem certeza que deseja resetar todo o seu progresso em Legislação?")) {
                checkboxes.forEach(box => {
                    box.checked = false;
                    const id = box.getAttribute('data-id');
                    localStorage.removeItem('study_leg_' + id);
                });
                updateProgress();
            }
        }
    </script>
</body>
</html>
